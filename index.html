<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="meta.title">Guía de afilado MANZAKI</title>
<meta name="description" content="">
<meta name="theme-color" content="#111616">
<meta name="robots" content="index,follow">
<meta property="og:title" content="MANZAKI">
<meta property="og:type" content="website">

<style>
/* =========================================================================
   MANZAKI — guía de afilado
   Paleta de marca (embalaje y manual). Contrastes comprobados sobre #111616:
     #F4F2EA  16.6:1   texto corrido
     #C4A52E   8.4:1   titulares, cifras, acentos (nunca párrafos largos)
     #F08A7A   7.6:1   advertencias
   ========================================================================= */

:root {
  --ink: #111616;
  --ink-2: #202626;
  --ink-3: #2b3232;
  --gold: #C4A52E;
  --gold-dim: #8d7621;
  --paper: #F4F2EA;
  --paper-dim: #b9bab4;
  --alert: #F08A7A;
  --alert-bg: #2a1512;
  --alert-line: #7A1F16;
  --ok: #8FD3A8;

  --font-display: "Playfair Display", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --step--1: clamp(.8rem, .77rem + .15vw, .875rem);
  --step-0: clamp(1rem, .96rem + .2vw, 1.075rem);
  --step-1: clamp(1.2rem, 1.1rem + .5vw, 1.4rem);
  --step-2: clamp(1.5rem, 1.3rem + .9vw, 2rem);
  --step-3: clamp(2rem, 1.6rem + 1.9vw, 3.25rem);

  --gutter: clamp(1rem, .6rem + 2vw, 2rem);
  --measure: 34rem;
  --radius: 4px;
  --tap: 48px;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background:
    radial-gradient(circle at 50% 8%, rgba(196,165,46,.10), transparent 30rem),
    linear-gradient(180deg, #151b1b 0%, var(--ink) 32rem, #0e1212 100%);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  min-height: 100vh;
  overflow-wrap: break-word;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: var(--step-3); }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); }
p { margin: 0 0 1em; max-width: var(--measure); }
a { color: var(--gold); text-underline-offset: .2em; }
img, video, svg { max-width: 100%; height: auto; display: block; }

.wrap { width: 100%; max-width: 62rem; margin-inline: auto; padding-inline: var(--gutter); }
.narrow { max-width: 44rem; }

/* --- Foco visible siempre, también en modo ratón ------------------------ */
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 2px; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--gold); color: var(--ink); padding: .75rem 1rem; font-weight: 600;
}
.skip:focus { left: 0; }

.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* --- Cabecera ----------------------------------------------------------- */
.site-head {
  position: sticky; top: 0; z-index: 20;
  background: rgba(17,22,22,.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--ink-3);
}
.site-head__in { display: flex; align-items: center; gap: 1rem; min-height: 56px; }
.brand {
  font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .34em;
  color: var(--paper); text-decoration: none; text-transform: uppercase; margin-right: auto;
  padding-block: .5rem;
}
.brand span { color: var(--gold); }

.lang { display: flex; align-items: center; gap: .4rem; }
.lang select {
  appearance: none; background: var(--ink-2); color: var(--paper);
  border: 1px solid var(--ink-3); border-radius: var(--radius);
  font: inherit; font-size: var(--step--1); padding: .55rem 2rem .55rem .7rem; min-height: 40px;
  background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
  background-position: right 1.05rem center, right .8rem center;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}

/* --- Portada ------------------------------------------------------------ */
.hero { padding-block: clamp(2.5rem, 8vw, 5rem) clamp(2rem, 6vw, 3.5rem); }
.eyebrow {
  font-size: var(--step--1); letter-spacing: .26em; text-transform: uppercase;
  color: var(--gold); margin: 0 0 1rem;
}
.lead { font-size: var(--step-1); color: var(--paper); max-width: 32rem; }

.opening {
  position: relative;
  margin-bottom: 1.6rem;
  padding: clamp(1.2rem, 3vw, 1.8rem);
  border: 1px solid rgba(196,165,46,.18);
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(32,38,38,.96), rgba(20,26,26,.90));
  box-shadow: 0 14px 36px rgba(0,0,0,.18);
}
.opening::before {
  content: "";
  position: absolute;
  left: 0; top: 1rem; bottom: 1rem; width: 3px;
  background: var(--gold);
  border-radius: 99px;
}

.cta-row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: var(--tap); padding: .75rem 1.4rem;
  font: inherit; font-weight: 600; text-decoration: none; text-align: center;
  border-radius: var(--radius); border: 1px solid var(--gold);
  background: transparent; color: var(--gold); cursor: pointer;
  transition: background-color .15s ease, color .15s ease;
}
.btn:hover { background: rgba(196,165,46,.12); }
.btn--primary { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn--primary:hover { background: #d8b93c; }
.btn--quiet { border-color: var(--ink-3); color: var(--paper); }
.btn--quiet:hover { background: var(--ink-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* --- Rejilla de argumentos --------------------------------------------- */
.facts { display: grid; gap: 1px; background: var(--ink-3); border: 1px solid var(--ink-3); margin-block: 2.5rem; }
@media (min-width: 40rem) { .facts { grid-template-columns: repeat(4, 1fr); } }
.fact { background: var(--ink); padding: 1.25rem; }
.fact h3 { font-size: var(--step-0); font-family: var(--font-body); font-weight: 600; color: var(--gold); margin-bottom: .35rem; }
.fact p { font-size: var(--step--1); color: var(--paper-dim); margin: 0; }

/* --- Vídeo -------------------------------------------------------------- */
.video { margin-block: 2.5rem; }
.video__frame { position: relative; background: var(--ink-2); border: 1px solid var(--ink-3); }
.video__frame video, .video__frame iframe { width: 100%; aspect-ratio: 16/9; display: block; border: 0; }
.video__poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video__play {
  position: absolute; inset: 0; display: grid; place-items: center; gap: .75rem;
  width: 100%; background: rgba(17,22,22,.45); border: 0; color: var(--paper);
  font: inherit; font-weight: 600; cursor: pointer;
}
.video__play::before {
  content: ""; width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid var(--gold); background: rgba(17,22,22,.7)
    linear-gradient(transparent, transparent);
  clip-path: none;
}
.video__play span { background: rgba(17,22,22,.8); padding: .4rem .8rem; border-radius: var(--radius); }
.video__ph { display: grid; place-items: center; aspect-ratio: 16/9; color: var(--paper-dim); text-align: center; padding: 1rem; }
details.transcript { margin-top: 1rem; border-top: 1px solid var(--ink-3); padding-top: 1rem; }
details.transcript summary { cursor: pointer; color: var(--gold); font-weight: 600; min-height: var(--tap); display: flex; align-items: center; }
details.transcript p { font-size: var(--step--1); color: var(--paper-dim); max-width: var(--measure); }

/* --- Test --------------------------------------------------------------- */
.quiz { padding-block: 1.5rem 3rem; }
.progress { margin-bottom: 1.75rem; }
.progress__label { font-size: var(--step--1); letter-spacing: .16em; text-transform: uppercase; color: var(--paper-dim); margin-bottom: .5rem; }
.progress__track { height: 3px; background: var(--ink-3); }
.progress__bar { height: 100%; background: var(--gold); transition: width .25s ease; }

fieldset { border: 0; margin: 0; padding: 0; }
legend { padding: 0; }
.q__title { font-family: var(--font-display); font-size: var(--step-2); margin: 0 0 .5rem; }
.q__help { color: var(--paper-dim); font-size: var(--step--1); max-width: var(--measure); margin-bottom: 1.5rem; }

.options { display: grid; gap: .6rem; margin: 0 0 1.5rem; padding: 0; list-style: none; }
@media (min-width: 34rem) { .options--cards { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 52rem) { .options--cards { grid-template-columns: repeat(3, 1fr); } }

.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt label,
.opt__box {
  display: flex; gap: .9rem; align-items: flex-start;
  min-height: var(--tap); padding: .9rem 1rem;
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: var(--radius);
  cursor: pointer; transition: border-color .15s ease, background-color .15s ease;
  height: 100%;
}
.opt:hover .opt__box { border-color: var(--gold-dim); }
.opt input:focus-visible + .opt__box { outline: 3px solid var(--gold); outline-offset: 3px; }
.opt input:checked + .opt__box { border-color: var(--gold); background: #232a26; }
.opt input:checked + .opt__box .opt__mark { border-color: var(--gold); background: var(--gold); }
.opt__mark {
  flex: 0 0 auto; width: 20px; height: 20px; margin-top: .2rem;
  border: 2px solid var(--paper-dim); border-radius: 50%;
}
.opt__body { min-width: 0; }
.opt__name { font-weight: 600; display: block; }
.opt__desc { display: block; font-size: var(--step--1); color: var(--paper-dim); margin-top: .15rem; }
.opt__art { width: 100%; margin-bottom: .6rem; }
.opt--card .opt__box { flex-direction: column; gap: 0; }
.opt--card .opt__mark { position: absolute; top: .9rem; right: .9rem; margin: 0; }

.field { margin-bottom: 1.5rem; }
.field label { display: block; font-weight: 600; margin-bottom: .4rem; }
.field input[type="number"] {
  width: 100%; max-width: 12rem; min-height: var(--tap);
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: var(--radius);
  color: var(--paper); font: inherit; font-size: var(--step-1); padding: .5rem .75rem;
}
.field .hint { font-size: var(--step--1); color: var(--paper-dim); margin: .4rem 0 0; }
.field .err { color: var(--alert); font-size: var(--step--1); margin: .4rem 0 0; }

.nav-row { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.5rem; }
.nav-row .btn { flex: 1 1 auto; }
@media (min-width: 30rem) { .nav-row .btn { flex: 0 0 auto; } }

/* --- Ficha de resultado ------------------------------------------------- */
.card {
  background: var(--ink-2); border: 1px solid var(--ink-3);
  border-top: 3px solid var(--gold); padding: clamp(1.25rem, 4vw, 2rem);
}
.card__title { font-size: var(--step-2); margin-bottom: 1.25rem; }

.angle-figure { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.angle-figure svg { flex: 0 0 auto; width: 132px; }
.angle-read { font-family: var(--font-display); font-size: var(--step-3); color: var(--gold); line-height: 1; }
.angle-read small { display: block; font-family: var(--font-body); font-size: var(--step--1); color: var(--paper-dim); letter-spacing: .16em; text-transform: uppercase; margin-top: .5rem; }

.spec { list-style: none; margin: 0 0 1.5rem; padding: 0; border-top: 1px solid var(--ink-3); }
.spec > div { display: grid; gap: .1rem .75rem; padding: .8rem 0; border-bottom: 1px solid var(--ink-3); }
@media (min-width: 34rem) { .spec > div { grid-template-columns: 11rem 1fr; } }
.spec dt { font-size: var(--step--1); letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim); }
.spec dd { margin: 0; }

.note, .warn, .stop {
  border-left: 3px solid var(--gold); background: rgba(196,165,46,.07);
  padding: .85rem 1rem; margin: 0 0 .75rem; font-size: var(--step--1);
}
.note p, .warn p, .stop p { margin: 0; max-width: none; }
.warn, .stop { border-left-color: var(--alert-line); background: var(--alert-bg); color: var(--alert); }
.warn strong, .stop strong { color: var(--alert); }
.warn::before, .stop::before { content: "!"; display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; border: 1px solid currentColor; border-radius: 50%; margin-right: .5em; font-weight: 700; font-size: .85em; vertical-align: .05em; }

.actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.75rem; }

/* --- Modo paso a paso --------------------------------------------------- */
.step { padding-block: 1.5rem 4rem; }
.step__k { font-size: var(--step--1); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: .75rem; }
.step h2 { font-size: var(--step-2); }
.step__body { font-size: var(--step-1); max-width: var(--measure); }
.step__art { margin: 1.5rem 0; border: 1px solid var(--ink-3); }
.side-flag {
  display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 1rem;
  border: 1px solid var(--gold); color: var(--gold); border-radius: 999px;
  padding: .35rem .9rem; font-size: var(--step--1); font-weight: 600; letter-spacing: .08em;
}
.toggles { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--ink-3); }
.toggle { display: inline-flex; align-items: center; gap: .5rem; min-height: var(--tap); font-size: var(--step--1); color: var(--paper-dim); cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--gold); }
.checkbox-confirm { display: flex; align-items: center; gap: .6rem; min-height: var(--tap); margin-top: 1rem; font-weight: 600; cursor: pointer; }
.checkbox-confirm input { width: 22px; height: 22px; accent-color: var(--gold); }

/* --- Páginas de contenido ---------------------------------------------- */
.page { padding-block: 2.5rem 4rem; }
.page h2 { margin-top: 2.25rem; }
.page ul { max-width: var(--measure); padding-left: 1.1rem; }
.page li { margin-bottom: .4rem; }
.table-scroll { overflow-x: auto; margin-block: 1.25rem; }
table { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: var(--step--1); }
th, td { text-align: left; padding: .7rem .6rem; border-bottom: 1px solid var(--ink-3); vertical-align: top; }
th { color: var(--gold); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .8em; }

.site-foot { border-top: 1px solid var(--ink-3); padding-block: 2rem 3rem; font-size: var(--step--1); color: var(--paper-dim); }
.site-foot nav { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; margin-bottom: 1rem; }
.site-foot a { color: var(--paper); }

.toast {
  position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
  background: var(--gold); color: var(--ink); font-weight: 600; font-size: var(--step--1);
  padding: .7rem 1.1rem; border-radius: var(--radius); z-index: 60; max-width: calc(100% - 2rem);
}

/* --- Alto contraste ----------------------------------------------------- */
body.hc {
  --ink: #000; --ink-2: #000; --ink-3: #fff;
  --paper: #fff; --paper-dim: #fff; --gold: #FFD84D; --alert: #FF9A8A;
}
body.hc .opt__box, body.hc .card, body.hc .site-head { border-width: 2px; }
body.hc .opt input:checked + .opt__box { background: #000; outline: 2px solid var(--gold); }

/* --- Preferencias del sistema ------------------------------------------ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* --- Impresión ---------------------------------------------------------- */
@media print {
  body { background: #fff; color: #000; }
  .site-head, .site-foot, .actions, .video, .skip, .toast, .nav-row { display: none !important; }
  .card { border: 1px solid #000; border-top-width: 3px; }
  .spec dt { color: #444; }
  .angle-read, .eyebrow, a { color: #000; }
  .warn, .stop, .note { border-left: 3px solid #000; background: #f2f2f2; color: #000; }
}


/* =========================================================================
   Apertura: el cliente entra directamente a la pregunta
   ========================================================================= */
.opening { padding-block: clamp(2rem, 7vw, 4rem) clamp(1.5rem, 4vw, 2.5rem); }
.opening__q {
  font-size: clamp(2.1rem, 1.4rem + 3.4vw, 4rem);
  max-width: 16ch; margin-bottom: .75rem;
}
.opening__q::after {
  content: ""; display: block; width: 3.5rem; height: 2px;
  background: var(--gold); margin-top: 1.5rem;
}
.opening .lead { color: var(--paper-dim); font-size: var(--step-0); max-width: 40ch; }

/* --- Rejilla de hojas --------------------------------------------------- */
.picks { display: grid; gap: .75rem; margin: 0 0 2.5rem; padding: 0; list-style: none; }
@media (min-width: 30rem) { .picks { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 52rem) { .picks { grid-template-columns: repeat(3, 1fr); } }

.pick { position: relative; }
.pick input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; margin: 0; cursor: pointer; z-index: 1;
}
.pick label {
  display: block; position: relative; overflow: hidden; height: 100%;
  padding: 1.1rem 1.1rem 1.25rem;
  background: linear-gradient(158deg, var(--ink-2) 0%, var(--ink) 78%);
  border: 1px solid var(--ink-3); border-radius: var(--radius);
  cursor: pointer; transition: border-color .18s ease, transform .18s ease;
}
.pick label::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 42%, rgba(196,165,46,.14) 50%, transparent 58%);
  transform: translateX(-110%); transition: transform .55s ease; pointer-events: none;
}
.pick:hover label { border-color: var(--gold-dim); transform: translateY(-2px); }
.pick:hover label::after { transform: translateX(110%); }
.pick input:focus-visible + label { outline: 3px solid var(--gold); outline-offset: 3px; }
.pick input:checked + label { border-color: var(--gold); background: linear-gradient(158deg, #262d27 0%, var(--ink) 80%); }
.pick input:checked + label .blade .blade__g { stroke-width: 2; }

.pick__art { display: block; margin-bottom: .9rem; }
.pick__art .blade { width: 100%; height: auto; }
.pick__name {
  display: block; font-family: var(--font-display); font-size: var(--step-1);
  line-height: 1.2; margin-bottom: .2rem;
}
.pick__desc { display: block; font-size: var(--step--1); color: var(--paper-dim); }

/* Las hojas que el afilador no debe tocar: presentes, pero apagadas. */
.picks--no .pick label { background: none; border-style: dashed; }
.picks--no .pick__art { opacity: .55; }
.picks--no .pick__name { font-size: var(--step-0); font-family: var(--font-body); font-weight: 600; }
.picks--no .pick input:checked + label { border-style: solid; border-color: var(--alert-line); }

.rule { display: flex; align-items: center; gap: 1rem; margin: 0 0 1.25rem; }
.rule::before, .rule::after { content: ""; height: 1px; background: var(--ink-3); flex: 1; }
.rule span {
  font-size: var(--step--1); letter-spacing: .22em; text-transform: uppercase;
  color: var(--paper-dim); white-space: nowrap;
}

.chip {
  display: inline-block; margin: 0 0 1.25rem;
  border: 1px solid var(--gold-dim); border-radius: 999px;
  padding: .3rem .85rem; font-size: var(--step--1); color: var(--gold);
  letter-spacing: .04em;
}

/* =========================================================================
   El veredicto: el ángulo, grande
   ========================================================================= */
.verdict {
  position: relative; overflow: hidden;
  border: 1px solid var(--ink-3); border-top: 3px solid var(--gold);
  background: radial-gradient(120% 100% at 12% 0%, #232a26 0%, var(--ink) 62%);
  padding: clamp(1.5rem, 5vw, 2.75rem);
}
.verdict__grid { display: flex; align-items: center; gap: clamp(1rem, 4vw, 2.5rem); flex-wrap: wrap; }
.verdict__num { line-height: 1; }
.verdict__angle {
  display: block; font-family: var(--font-display); color: var(--gold);
  font-size: clamp(4.5rem, 3rem + 11vw, 9rem); line-height: .85; letter-spacing: -.03em;
}
.verdict__angle i { font-style: normal; font-size: .45em; vertical-align: .55em; }
.verdict__unit {
  display: block; margin-top: .75rem; font-size: var(--step--1);
  letter-spacing: .24em; text-transform: uppercase; color: var(--paper-dim);
}
.verdict__why { margin: 1.5rem 0 0; max-width: 40ch; color: var(--paper); }
.verdict__blade { margin-top: 1.5rem; opacity: .5; max-width: 20rem; }
.verdict__blade .blade { width: 100%; }
.verdict__grid--step { margin-bottom: 1.5rem; }

/* =========================================================================
   Componentes menores
   ========================================================================= */
.btn--big { font-size: var(--step-1); padding: .95rem 1.75rem; }
.card--alert { border-top-color: var(--alert-line); }

.options--inline { gap: .5rem; }
@media (min-width: 34rem) { .options--inline { grid-template-columns: repeat(3, 1fr); } }

.gate {
  margin: 1.75rem 0 0; padding: 1.25rem;
  border: 1px dashed var(--ink-3); border-radius: var(--radius); background: var(--ink-2);
}
.gate__q { font-weight: 600; margin-bottom: .3rem; max-width: var(--measure); }
.gate .options { margin-bottom: 0; }
.gate .stop { margin-top: 1rem; }

.steps-list { max-width: var(--measure); padding-left: 1.2rem; margin-bottom: 1.5rem; }
.steps-list li { margin-bottom: .35rem; }

.marker-grid { display: grid; gap: 1rem; list-style: none; padding: 0; margin: 0 0 1rem; }

  'method.title': 'Méthode et sources',
  'method.lead': 'Comment les recommandations de ce guide ont été définies et ce qui a été vérifié.',
  'method.h1': 'Angle par côté et angle total',
  'method.p1': 'Les quatre valeurs de la base (15°, 18°, 20° et 22°) sont des angles par côté. Un couteau affûté à 15° par côté a un fil total de 30°. Certains fabricants publient l\u2019angle par côté, d\u2019autres le total ; vérifiez donc lequel vous lisez avant de comparer.',
  'method.h2': 'Ce que disent les fabricants',
  'method.p2': 'Ces valeurs proviennent de la documentation des fabricants ou de leurs fiches produit officielles. Elles servent de référence ; la donnée figurant dans la notice de votre propre couteau prime sur n\u2019importe quel tableau.',
  'method.h3': 'Tolérance par rapport aux quatre réglages',
  'method.p3': 'Aucun fabricant ne publie de tolérance officielle. L\u2019échelle ci-dessous est une convention de ce projet, volontairement prudente, et elle est présentée comme telle à l\u2019utilisateur.',
  'method.tol1': 'Jusqu\u2019à 1° d\u2019écart : en pratique vous travaillez le biseau d\u2019origine.',
  'method.tol2': 'Jusqu\u2019à 2° : le biseau change légèrement, de façon acceptable.',
  'method.tol3': 'Jusqu\u2019à 3° : changement réel de géométrie. Nous avertissons et conseillons d\u2019aller lentement.',
  'method.tol4': 'Plus de 3° : il s\u2019agit d\u2019un reprofilage. Nous conseillons d\u2019interroger le fabricant.',
  'method.h4': 'Pourquoi les points de départ ne suivent pas les catégories commerciales',
  'method.p4': 'Les catégories imprimées sur l\u2019emballage sont indicatives. Les données officielles montrent que les couteaux européens récents sont souvent aiguisés plus fin que ne le suggère l\u2019étiquette, et que les santoku le sont nettement plus fin que 18° par côté. Ce guide retient donc 15° comme point de départ pour les santoku et les lames japonaises fines à double biseau, et avertit lorsque l\u2019angle d\u2019usine passe sous le réglage minimal.',
  'method.h5': 'Limites connues',
  'method.p5': 'La base ne propose aucun réglage en dessous de 15° ni au-dessus de 22° par côté. En dehors de cette plage, ce guide ne propose pas d\u2019angle.',

  'method.note.zwilling': 'Leur guide d’entretien indique environ 15° entre la lame et le fusil pour les couteaux ZWILLING.',
  'method.note.spyderco': 'Biseau primaire autour de 15° par côté ; leur affûteur propose 30° et 40° au total.',
  'method.note.global': 'Repris dans le tableau des recommandations de fabricants de Tormek.',

/**
 * MANZAKI — Motor de recomendación (tabla de decisión).
 *
 * Este módulo NO contiene texto visible ni marcado HTML: devuelve únicamente
 * códigos. La capa de presentación traduce esos códigos con i18n.
 *
 * Los cuatro ajustes de la base son ángulos POR LADO del filo.
 * Fuentes y justificación: ver /metodologia.html y README.md
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.ManzakiRules = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  'use strict';

  /** Ajustes disponibles en la base MANZAKI, en grados por lado. */
  const SETTINGS = Object.freeze([15, 18, 20, 22]);

  /**
   * Tolerancia entre el ángulo del fabricante y el ajuste disponible.
   * Convención de ingeniería del proyecto, NO un dato publicado por ningún
   * fabricante. Documentada como tal en la página de metodología.
   */
  const TOLERANCE = Object.freeze({
    equivalent: 1.0, // diferencia irrelevante en la práctica
    acceptable: 2.0, // se ensancha/afina algo el bisel, aceptable
    caution: 3.0     // cambio perceptible de geometría: avisar
    // > caution  -> reperfilado real: recomendar consultar al fabricante
  });

  /**
   * Tabla de tipos de cuchillo.
   * `range` = [ajuste más fino aceptable, ajuste más resistente aceptable].
   * `def`   = punto de partida cuando el usuario no expresa prioridad. Sigue
   *           la tabla impresa en el embalaje MANZAKI (15 japonés/fileteador,
   *           18 santoku/chef/trinchar, 20 europeo/diario, 22 caza/EDC) para
   *           que la caja y la web nunca digan cifras distintas. Cuando el
   *           dato oficial del fabricante queda por debajo, se avisa mediante
   *           `notes`: ver santoku_factory_lower y euro_modern_vs_vintage.
   * `notes` = códigos informativos que la UI traduce.
   */
  /**
   * Ángulo por tipo de hoja, en grados POR LADO.
   *
   * Los valores por defecto son los de la caja del producto. La investigación
   * de agosto de 2026 sobre datos publicados por los fabricantes muestra que
   * esa tabla queda sistemáticamente un escalón más abierta que los filos de
   * fábrica actuales (ver `metodologia.html` para la tabla con fuentes):
   *
   *   Wüsthof 14,5° · Zwilling 15° (santoku y Miyabi 9–12°) · Global 15°
   *   Shun 16° · Victorinox 15–20° · Spyderco ~15° · Benchmade 15–17,5°
   *   Buck 13–16°
   *
   * Se mantienen los valores de la caja para que el impreso y la web digan lo
   * mismo, pero `min` marca el ajuste más fino disponible que sigue siendo
   * razonable para esa hoja: si el cliente pide filo máximo, se baja hasta ahí
   * y se le explica por qué. Nunca por debajo de 15°, que es el tope físico
   * de la base.
   */
  const KNIFE_TYPES = Object.freeze({
    jp_double: { range: [15, 15], def: 15, sharp: 15, notes: ['factory_may_be_below_min'] },
    fillet:    { range: [15, 18], def: 15, sharp: 15, notes: [] },
    carving:   { range: [15, 18], def: 18, sharp: 15, notes: ['factory_often_lower'] },
    santoku:   { range: [15, 18], def: 18, sharp: 15, notes: ['santoku_factory_lower'] },
    chef:      { range: [15, 20], def: 18, sharp: 15, notes: ['euro_modern_vs_vintage', 'factory_often_lower'] },
    euro:      { range: [18, 20], def: 20, sharp: 18, notes: ['euro_modern_vs_vintage'] },
    paring:    { range: [18, 20], def: 20, sharp: 18, notes: [] },
    edc:       { range: [18, 22], def: 22, sharp: 18, notes: ['pocket_factory_lower'] },
    hunting:   { range: [18, 22], def: 22, sharp: 20, notes: ['pocket_factory_lower'] },
    cleaver:   { range: null,     def: null, sharp: null, notes: ['cleaver_needs_manufacturer'] },
    unsure:    { range: null,     def: null, sharp: null, notes: ['type_unknown'] }
  });

  /** Filos que el sistema NO debe afilar. */
  const INCOMPATIBLE = Object.freeze({
    serrated:     'stop_serrated',
    ceramic:      'stop_ceramic',
    single_bevel: 'stop_single_bevel',
    scissors:     'stop_scissors',
    axe:          'stop_axe'
  });

  const CONDITION_DISCS = Object.freeze({
    maintain: ['1000'],
    dull:     ['400', '1000'],
    minor:    ['400', '1000'],
    unsure:   ['1000']
  });

  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  /**
   * Ajuste(s) más cercano(s) a un ángulo dado.
   * @returns {{nearest:number, delta:number, tie:number[]|null}}
   */
  function nearestSetting(angle) {
    let best = SETTINGS[0];
    let bestDist = Math.abs(angle - best);
    for (const s of SETTINGS) {
      const d = Math.abs(angle - s);
      if (d < bestDist - 1e-9) { best = s; bestDist = d; }
    }
    const tied = SETTINGS.filter(s => Math.abs(Math.abs(angle - s) - bestDist) < 1e-9);
    return { nearest: best, delta: +(angle - best).toFixed(2), tie: tied.length > 1 ? tied : null };
  }

  function toleranceCode(absDelta) {
    if (absDelta <= TOLERANCE.equivalent) return 'delta_equivalent';
    if (absDelta <= TOLERANCE.acceptable) return 'delta_acceptable';
    if (absDelta <= TOLERANCE.caution) return 'delta_caution';
    return 'delta_large';
  }

  /**
   * @typedef {Object} Answers
   * @property {'straight_double'|'serrated'|'ceramic'|'single_bevel'|'scissors'|'axe'|'unsure'} [edge]
   * @property {'yes'|'no'|'unsure'} [knowsAngle]
   * @property {number} [manufacturerAngle]  grados POR LADO
   * @property {keyof KNIFE_TYPES} [knifeType]
   * @property {'precision'|'balanced'|'durability'} [priority]
   * @property {'small'|'normal'|'tall'|'unsure'} [bladeHeight]
   * @property {'yes'|'no'|'untested'} [discReachesEdge]
   * @property {'firm'|'loose'|'unsure'} [magneticGrip]
   * @property {'maintain'|'dull'|'minor'|'deep_nick'|'tip_broken'|'unsure'} [condition]
   */

  /**
   * @param {Answers} a
   * @returns {Object} recomendación en códigos
   */
  function recommend(a) {
    a = a || {};
    const out = {
      status: 'ok',              // 'ok' | 'stop' | 'ask_manufacturer' | 'incomplete'
      stop: [],                  // códigos de parada
      warnings: [],
      notes: [],
      angle: null,
      angleSource: null,         // 'manufacturer_exact'|'manufacturer_nearest'|'type_default'|'priority'
      manufacturerAngle: null,
      delta: null,
      deltaCode: null,
      needsPriority: false,
      discs: [],
      needsRiser: false,         // true | false | 'maybe'
      markerTest: false,
      pressure: 'light',
      bothSides: true,
      compatible: null
    };

    // ---- 1. Compatibilidad. Manda sobre todo lo demás. -------------------
    if (!a.edge) { out.status = 'incomplete'; return out; }
    if (a.edge === 'unsure') {
      out.status = 'ask_manufacturer';
      out.compatible = null;
      out.notes.push('edge_unknown');
      return out;
    }
    if (INCOMPATIBLE[a.edge]) {
      out.status = 'stop';
      out.compatible = false;
      out.stop.push(INCOMPATIBLE[a.edge]);
      return out;
    }
    out.compatible = true;

    // ---- 2. Daños que no se reparan en casa. ------------------------------
    if (a.condition === 'deep_nick') { out.status = 'stop'; out.stop.push('stop_deep_nick'); }
    if (a.condition === 'tip_broken') { out.status = 'stop'; out.stop.push('stop_tip_broken'); }

    // ---- 3. Sujeción magnética. ------------------------------------------
    if (a.magneticGrip === 'loose') { out.status = 'stop'; out.stop.push('stop_not_secure'); }
    if (a.magneticGrip === 'unsure') out.warnings.push('verify_grip_before_starting');

    if (out.status === 'stop') return out;

    // ---- 4. Ángulo. El fabricante manda. ---------------------------------
    if (a.knowsAngle === 'yes' && typeof a.manufacturerAngle === 'number' && !Number.isNaN(a.manufacturerAngle)) {
      const m = a.manufacturerAngle;
      out.manufacturerAngle = m;

      if (m < SETTINGS[0]) {
        // El sistema no puede afinar por debajo de 15°.
        out.angle = SETTINGS[0];
        out.angleSource = 'manufacturer_nearest';
        out.delta = +(m - SETTINGS[0]).toFixed(2);
        out.deltaCode = toleranceCode(Math.abs(out.delta));
        out.warnings.push('below_min_setting');
        if (m <= 12) { out.warnings.push('far_below_min_setting'); out.status = 'ask_manufacturer'; }
      } else if (m > SETTINGS[SETTINGS.length - 1] + 2) {
        out.angle = null;
        out.angleSource = null;
        out.status = 'ask_manufacturer';
        out.warnings.push('above_max_setting');
      } else {
        const { nearest, delta, tie } = nearestSetting(clamp(m, SETTINGS[0], SETTINGS[SETTINGS.length - 1] + 2));
        out.delta = delta;
        out.deltaCode = toleranceCode(Math.abs(delta));
        if (tie) {
          if (a.priority === 'precision') { out.angle = Math.min.apply(null, tie); out.angleSource = 'priority'; }
          else if (a.priority === 'durability') { out.angle = Math.max.apply(null, tie); out.angleSource = 'priority'; }
          else { out.needsPriority = true; out.angle = Math.min.apply(null, tie); out.angleSource = 'manufacturer_nearest'; }
          out.delta = +(m - out.angle).toFixed(2);
          out.deltaCode = toleranceCode(Math.abs(out.delta));
        } else {
          out.angle = nearest;
          out.angleSource = Math.abs(delta) < 1e-9 ? 'manufacturer_exact' : 'manufacturer_nearest';
        }
        if (m > SETTINGS[SETTINGS.length - 1]) out.warnings.push('above_max_setting');
        if (out.deltaCode === 'delta_large') { out.warnings.push('delta_exceeds_tolerance'); out.status = 'ask_manufacturer'; }
      }
    } else {
      // Ángulo desconocido: se parte del tipo de hoja.
      const t = KNIFE_TYPES[a.knifeType];
      if (!t) { out.status = 'incomplete'; return out; }
      out.notes.push.apply(out.notes, t.notes);

      if (!t.range) {
        out.status = 'ask_manufacturer';
        out.angle = null;
      } else {
        const [lo, hi] = t.range;
        // Filo máximo baja al ajuste que más se acerca al filo de fábrica
        // actual de esa hoja, no al mínimo de la caja.
        if (a.priority === 'precision') {
          out.angle = t.sharp != null ? t.sharp : lo;
          out.angleSource = 'priority';
          if (t.sharp != null && t.sharp < t.def) out.notes.push('sharper_than_box');
        }
        else if (a.priority === 'durability') { out.angle = hi; out.angleSource = 'priority'; }
        else if (a.priority === 'balanced') { out.angle = t.def; out.angleSource = 'priority'; }
        else { out.angle = t.def; out.angleSource = 'type_default'; out.needsPriority = lo !== hi; }
        out.markerTest = true;
        out.notes.push('starting_point_only');
      }
    }

    // ---- 5. Altura de hoja y alcance del disco. ---------------------------
    if (a.discReachesEdge === 'no') out.needsRiser = true;
    else if (a.discReachesEdge === 'yes') out.needsRiser = false;
    else if (a.bladeHeight === 'tall' || a.bladeHeight === 'unsure') out.needsRiser = 'maybe';
    else out.needsRiser = 'maybe';
    if (out.needsRiser === true) out.notes.push('riser_board_required');
    if (out.needsRiser === 'maybe') out.notes.push('riser_board_check');
    if (a.bladeHeight === 'small') out.notes.push('small_blade_check_grip');

    // ---- 6. Discos según el estado del filo. -----------------------------
    if (a.condition && CONDITION_DISCS[a.condition]) {
      out.discs = CONDITION_DISCS[a.condition].slice();
      if (a.condition === 'minor') out.notes.push('check_progress_often');
      if (a.condition === 'unsure') out.notes.push('start_fine_then_escalate');
    } else if (a.condition === undefined) {
      out.status = out.status === 'ok' ? 'incomplete' : out.status;
    }

    return out;
  }

  return {
    SETTINGS, TOLERANCE, KNIFE_TYPES, INCOMPATIBLE, CONDITION_DISCS,
    nearestSetting, toleranceCode, recommend
  };
});

/**
 * MANZAKI — biblioteca de ilustraciones SVG.
 *
 * Siluetas dibujadas para esta guía. Sirven para RECONOCER una forma de hoja,
 * nunca para deducir un ángulo. La geometría del afilador (base cuadrada con
 * un ángulo por canto, rodillo cilíndrico con un disco en cada extremo)
 * reproduce el producto real y no debe modificarse a ojo.
 */
window.MANZAKI_ART = (function () {
  'use strict';

  const G = 'var(--gold)';
  const D = 'var(--paper-dim)';

  /* ---------- Siluetas de hoja ----------
     Lienzo 300x96. Mango a la izquierda (6–70), hoja a la derecha.          */

  function svg(inner, extra) {
    return `<svg class="blade" viewBox="0 0 300 96" role="img" aria-hidden="true" focusable="false"
      preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${G}" stop-opacity=".26"/>
        <stop offset="1" stop-color="${G}" stop-opacity=".05"/>
      </linearGradient></defs>
      <g class="blade__g" fill="url(#bg)" stroke="${G}" stroke-width="1.6"
         stroke-linejoin="round" stroke-linecap="round">${inner}</g>
      ${extra || ''}
    </svg>`;
  }

  const HANDLE = '<rect x="8" y="38" width="62" height="20" rx="4" opacity=".65"/>';
  const HANDLE_TALL = '<rect x="8" y="34" width="62" height="26" rx="4" opacity=".65"/>';

  const SHAPES = {
    /* cocina */
    chef:      HANDLE + '<path d="M70 30h162c30 3 50 15 62 32H70z"/>',
    euro:      HANDLE + '<path d="M70 32h150c26 3 44 13 54 28H70z"/>',
    santoku:   HANDLE_TALL + '<path d="M70 22h176c24 2 34 12 34 24 0 12-12 18-36 18H70z"/>',
    paring:    HANDLE + '<path d="M70 34h110c22 4 34 14 40 26H70z"/>',
    fillet:    HANDLE + '<path d="M70 38h176c28 2 44 7 52 12-8 5-24 10-52 10H70z"/>',
    jp_double: HANDLE + '<path d="M70 32h182c24 4 36 14 42 26H70z"/>',
    cleaver:   HANDLE_TALL + '<path d="M70 12h218v52H70z"/>' +
               '<circle cx="264" cy="24" r="5" fill="none" opacity=".55"/>',
    /* fuera de la cocina */
    edc:       '<rect x="8" y="34" width="88" height="26" rx="6" opacity=".65"/>' +
               '<path d="M96 36h108c26 4 42 14 50 26H96z"/>',
    hunting:   HANDLE + '<path d="M70 30h150c30 4 52 14 66 30H70z"/>' +
               '<path d="M220 30c26 6 44 14 56 24" fill="none" opacity=".45" stroke-width="1.2"/>',
    /* no compatibles */
    serrated:  HANDLE + '<path d="M70 28h162c30 3 50 13 62 28H70z"/>',
    ceramic:   HANDLE + '<path d="M70 32h156c26 3 44 13 54 28H70z" stroke-dasharray="7 5"/>',
    single:    HANDLE + '<path d="M70 30h182c24 4 36 14 42 26H70z"/>' +
               '<path d="M70 46h234" fill="none" opacity=".8" stroke-width="1.2"/>',
    scissors:  '<path d="M40 20l208 34M40 76l208-34" fill="none" stroke-width="2"/>' +
               '<circle cx="28" cy="16" r="12" fill="none"/><circle cx="28" cy="80" r="12" fill="none"/>',
    axe:       '<rect x="128" y="6" width="22" height="84" rx="3" opacity=".65"/>' +
               '<path d="M150 14c44 0 74 12 86 34-12 22-42 34-86 34z"/>',
    unsure:    '<path d="M76 16h148a32 32 0 0 1 0 64H76z" stroke-dasharray="8 7"/>'
  };

  const TEETH = `<path d="M76 62q8-11 16 0 8-11 16 0 8-11 16 0 8-11 16 0 8-11 16 0 8-11 16 0 8-11 16 0 8-11 16 0 8-11 16 0 8-11 16 0"
     fill="none" stroke="${G}" stroke-width="1.5"/>`;
  const QMARK = `<text x="150" y="62" fill="${G}" font-size="40" font-family="var(--font-display)"
     text-anchor="middle">?</text>`;

  function bladeArt(key) {
    const shape = SHAPES[key] || SHAPES.unsure;
    if (key === 'serrated') return svg(shape, TEETH);
    if (key === 'unsure') return svg(shape, QMARK);
    return svg(shape);
  }

  /* ---------- El dial: la base vista en planta ----------
     Reproduce la base real: un CUADRADO RECTO (no un rombo) con un ángulo
     rotulado en el centro de cada lado. En reposo, tal como sale en la
     fotografía de producto: 20° arriba, 22° a la derecha, 15° abajo y 18° a
     la izquierda. El indicador dorado marca la posición de trabajo y el
     cuadrado gira para llevar allí el ángulo elegido.
     No cambiar este orden sin comprobarlo contra la fotografía. */
  const ORDER = [20, 22, 15, 18];   // sentido horario desde arriba

  function dial(angle, opts) {
    opts = opts || {};
    const idx = ORDER.indexOf(angle);
    const rot = idx < 0 ? 0 : -90 * idx;
    const CX = 60, CY = 72, OFF = 28;
    const POS = [[CX, CY - OFF], [CX + OFF, CY], [CX, CY + OFF], [CX - OFF, CY]];

    const labels = ORDER.map((a, i) => {
      const [x, y] = POS[i];
      const on = a === angle;
      return `<g transform="rotate(${-rot} ${x} ${y})">
        <text x="${x}" y="${y + 4}" text-anchor="middle" font-family="var(--font-body)"
          font-size="11" font-weight="${on ? 700 : 400}" fill="${on ? G : D}">${a}°</text>
        <line x1="${x - 7}" y1="${y + 9}" x2="${x + 7}" y2="${y + 9}"
          stroke="${on ? G : D}" stroke-width="1" opacity="${on ? '.9' : '.4'}"/>
      </g>`;
    }).join('');

    return `<svg class="dial" viewBox="0 0 120 130" width="${opts.size || 160}" role="img"
        aria-label="${opts.label || ''}" focusable="false">
      <path d="M60 4 L67 16 L53 16 Z" fill="${G}"/>
      <g transform="rotate(${rot} ${CX} ${CY})"
         style="transition:transform .6s cubic-bezier(.2,.75,.25,1)">
        <rect x="${CX - 40}" y="${CY - 40}" width="80" height="80" rx="3"
              fill="var(--ink-2)" stroke="${G}" stroke-width="1.5"/>
        <circle cx="${CX}" cy="${CY}" r="19" fill="var(--ink)" stroke="${D}"
                stroke-width="1" opacity=".9"/>
        ${labels}
      </g>
    </svg>`;
  }

  /* ---------- Elevar el rodillo con una tabla ---------- */
  function riser(ok) {
    const s = ok ? G : 'var(--alert)';
    return `<svg viewBox="0 0 280 130" role="img" aria-hidden="true" focusable="false">
      <line x1="8" y1="106" x2="272" y2="106" stroke="${D}" stroke-width="1.5"/>
      <rect x="20" y="80" width="66" height="26" fill="var(--ink-2)" stroke="${D}" stroke-width="1.3"/>
      <line x1="53" y1="80" x2="53" y2="34" stroke="var(--paper)" stroke-width="2.6"/>
      ${ok
        ? `<rect x="140" y="92" width="118" height="14" fill="var(--ink-2)" stroke="${D}" stroke-width="1.3"/>
           <rect x="160" y="62" width="76" height="30" rx="15" fill="var(--ink-2)" stroke="${s}" stroke-width="2"/>
           <line x1="53" y1="62" x2="160" y2="62" stroke="${s}" stroke-width="1" stroke-dasharray="4 5"/>`
        : `<g transform="rotate(-17 198 92)"><rect x="160" y="78" width="76" height="30" rx="15"
             fill="var(--ink-2)" stroke="${s}" stroke-width="2"/></g>
           <path d="M188 28l20 0-10 17z" fill="${s}"/>`}
    </svg>`;
  }

  /* ---------- Resultado de la prueba del rotulador ---------- */
  function marker(where) {
    const ink = 'var(--alert)';
    const clean = 'var(--ink-3)';
    return `<svg viewBox="0 0 200 96" role="img" aria-hidden="true" focusable="false">
      <path d="M14 20h150v40H14z" fill="var(--ink-2)" stroke="${D}" stroke-width="1.2"/>
      <path d="M164 20l24 20-24 20z" fill="none" stroke="${D}" stroke-width="1.2"/>
      <path d="M164 22l20 18-20 18z" fill="${where === 'top' ? ink : clean}" opacity=".85"/>
      <path d="M180 33l8 7-8 7z" fill="${where === 'edge' ? ink : clean}"/>
      ${where === 'even' ? `<path d="M164 22l24 18-24 18" fill="none" stroke="${G}"
        stroke-width="2" stroke-dasharray="3 4"/>` : ''}
    </svg>`;
  }


  /**
   * Iconos de redes, dibujados a mano en SVG sobre una rejilla de 24.
   * Van con `currentColor` para que hereden el color del enlace y cambien
   * solos en el modo de alto contraste. Son marcas registradas de sus
   * dueños: se usan solo como enlace a los perfiles de MANZAKI.
   */
  const SOCIAL_ICONS = {
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>'
      + '<circle cx="12" cy="12" r="4"/>'
      + '<circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/>',
    tiktok: '<path d="M14 3v11.2a3.6 3.6 0 1 1-2.7-3.5"/>'
      + '<path d="M14 3c.4 2.6 2 4.2 4.6 4.5"/>',
    facebook: '<path d="M14.6 21v-8h2.6l.5-3.2h-3.1V7.7c0-.9.3-1.6 1.7-1.6h1.6V3.2A22 22 0 0 0 15.4 3c-2.4 0-4 1.4-4 4.1v2.7H8.7V13h2.7v8z"'
      + ' fill="currentColor" stroke="none"/>'
  };

  /** Devuelve el SVG de una red, o cadena vacía si no la conocemos. */
  function socialIcon(name) {
    const d = SOCIAL_ICONS[name];
    if (!d) return '';
    return '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"'
      + ' fill="none" stroke="currentColor" stroke-width="1.7"'
      + ' stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  }

  return {
    socialIcon, bladeArt, dial, riser, marker, ORDER };

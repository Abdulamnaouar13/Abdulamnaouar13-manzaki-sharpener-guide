/**
 * MANZAKI — aplicación de la guía.
 *
 * Estructura: el cliente entra y lo primero que ve es la pregunta que le
 * importa, "¿qué cuchillo vas a afilar?", con las hojas dibujadas. Elegir la
 * hoja resuelve a la vez la compatibilidad y el tipo, así que el test se
 * queda en tres preguntas en lugar de siete.
 *
 * Las comprobaciones de seguridad que dependen de tener el cuchillo delante
 * (¿el disco alcanza el filo?, ¿el imán sujeta?) se hacen dentro del modo
 * paso a paso, en el momento en que el usuario está mirando el afilador.
 *
 * La lógica de recomendación vive en rules.js y no se toca desde aquí.
 */
(function () {
  'use strict';

  const CFG = window.MANZAKI_CONFIG;
  const RULES = window.ManzakiRules;
  const ART = window.MANZAKI_ART;
  const DICTS = window.MANZAKI_I18N;

  /* ===================== idioma ===================== */

  const SUPPORTED = CFG.languages.filter(l => DICTS[l]);

  function pickLanguage() {
    const q = new URLSearchParams(location.search).get('lang');
    if (q && SUPPORTED.includes(q)) return q;
    try {
      const saved = localStorage.getItem('manzaki.lang');
      if (saved && SUPPORTED.includes(saved)) return saved;
    } catch (e) {}
    for (const nav of (navigator.languages || [navigator.language || ''])) {
      const base = String(nav).slice(0, 2).toLowerCase();
      if (SUPPORTED.includes(base)) return base;
    }
    return SUPPORTED.includes(CFG.defaultLanguage) ? CFG.defaultLanguage : SUPPORTED[0];
  }

  let lang = pickLanguage();

  function t(key, vars) {
    const dict = DICTS[lang] || {};
    let s = dict[key];
    if (s === undefined) s = (DICTS[CFG.defaultLanguage] || {})[key];
    if (s === undefined) return key;
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function setLanguage(next) {
    lang = next;
    try { localStorage.setItem('manzaki.lang', next); } catch (e) {}
    document.documentElement.lang = next;
    const url = new URL(location.href);
    url.searchParams.set('lang', next);
    history.replaceState(null, '', url);
    translateStatic();
    mountReviewLinks();
    mountSocialLinks();
    updateStructuredData();
    if (app) render();
  }

  function translateStatic(root) {
    (root || document).querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    (root || document).querySelectorAll('[data-i18n-attr]').forEach(el => {
      el.getAttribute('data-i18n-attr').split(',').forEach(pair => {
        const [attr, key] = pair.split(':');
        el.setAttribute(attr.trim(), t(key.trim()));
      });
    });
    const title = document.querySelector('title[data-i18n-title]');
    if (title) document.title = t(title.getAttribute('data-i18n-title')) + ' · MANZAKI';
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute('content', t('meta.description'));
  }

  /**
   * Enlace al formulario de reseña de la tienda que corresponde al idioma
   * activo. Devuelve null si no hay nada configurado para ese idioma: sin
   * enlace no se pinta ninguna llamada a reseña.
   */
  function reviewLink() {
    if (CFG.reviewUrl) return CFG.reviewUrl;
    const dom = CFG.reviewDomains && CFG.reviewDomains[lang];
    if (!CFG.asin || !dom) return null;
    return 'https://' + dom + '/review/create-review?asin=' + encodeURIComponent(CFG.asin);
  }

  /** Los enlaces de reseña solo existen si hay URL. Nunca se inventa una. */
  function mountReviewLinks() {
    const url = reviewLink();
    document.querySelectorAll('[data-review-slot]').forEach(host => {
      host.innerHTML = url
        ? `<a class="btn btn--ghost btn--sm" href="${esc(url)}" target="_blank"
             rel="noopener">${esc(t('review.top'))}</a>` : '';
    });
    document.querySelectorAll('[data-review-foot]').forEach(host => {
      host.innerHTML = url
        ? `${esc(t('review.foot'))} <a href="${esc(url)}" target="_blank"
             rel="noopener">${esc(t('review.top'))}</a>` : '';
    });
  }

  /**
   * Iconos de redes. Cada uno aparece solo si su enlace está configurado.
   * `aria-label` lleva el nombre porque el icono es decorativo.
   */
  function mountSocialLinks() {
    const nets = ['instagram', 'tiktok', 'facebook'];
    const cfg = CFG.social || {};
    const html = nets.filter(n => cfg[n]).map(n =>
      `<a class="social__link" href="${esc(cfg[n])}" target="_blank" rel="noopener"
          aria-label="${esc(t('social.follow', { net: NET_NAMES[n] }))}"
          title="${esc(t('social.follow', { net: NET_NAMES[n] }))}">${ART.socialIcon(n)}</a>`).join('');
    document.querySelectorAll('[data-social-slot]').forEach(h => { h.innerHTML = html; });
    document.querySelectorAll('[data-social-foot]').forEach(h => {
      h.innerHTML = html ? `<span class="social__label">${esc(t('social.title'))}</span>` + html : '';
    });
  }

  const NET_NAMES = { instagram: 'Instagram', tiktok: 'TikTok', facebook: 'Facebook' };

  function mountLanguagePicker() {
    document.querySelectorAll('[data-lang-picker]').forEach(host => {
      host.innerHTML =
        `<label class="sr" for="lang-select">${esc(t('nav.language'))}</label>
         <select id="lang-select">${SUPPORTED.map(l =>
           `<option value="${l}"${l === lang ? ' selected' : ''}>${esc(DICTS[l]['lang.name'])}</option>`).join('')}</select>`;
      host.querySelector('select').addEventListener('change', e => setLanguage(e.target.value));
    });
  }

  /* ===================== estado ===================== */

  const app = document.getElementById('app');

  const ANSWER_KEYS = ['edge', 'knowsAngle', 'manufacturerAngle', 'knifeType',
    'priority', 'bladeHeight', 'discReachesEdge', 'magneticGrip', 'condition'];

  let state = { view: 'quiz', qi: 0, si: 0, side: 'a', answers: {}, error: null,
                fb: { q1: null, q2: null, text: '', status: null } };

  function save() {
    if (!CFG.persistProgress) return;
    try { localStorage.setItem(CFG.storageKey, JSON.stringify(state.answers)); } catch (e) {}
  }

  function restore() {
    const q = new URLSearchParams(location.search);
    if (q.has('a')) {
      try {
        const raw = JSON.parse(decodeURIComponent(escape(atob(q.get('a')))));
        ANSWER_KEYS.forEach(k => { if (raw[k] !== undefined) state.answers[k] = raw[k]; });
        state.view = 'result';
        return;
      } catch (e) {}
    }
    // A propósito NO se recuperan las respuestas guardadas.
    //
    // Este sitio se abre con un código QR, en la cocina, con el cuchillo ya en
    // la mano. Encontrarse marcadas las respuestas de la última vez es
    // desconcertante y, peor, peligroso: alguien que hoy afila otro cuchillo
    // podría llevarse el ángulo del de la semana pasada sin darse cuenta.
    // Cada visita empieza en blanco. Lo guardado solo sirve para no perder el
    // progreso si la página se recarga sola a mitad de sesión.
    if (!CFG.persistProgress) return;
    try { localStorage.removeItem(CFG.storageKey); } catch (e) {}
  }

  /* ===================== catálogo de hojas ===================== */

  /**
   * Compatibles: elegir una fija edge = filo liso de doble bisel.
   * `photo` son recortes de la fotografía de la gama MANZAKI. Ilustran la
   * FORMA de la hoja, nunca el ángulo. Los tipos sin fotografía usan la
   * silueta dibujada; están listados en el README como pendientes.
   */
  const KNIVES = [
    { v: 'chef',    photo: 'chef',    name: 'q3.chef',    desc: 'q3.chef.d' },
    { v: 'santoku', photo: 'santoku', name: 'q3.santoku', desc: 'q3.santoku.d' },
    { v: 'euro',    photo: 'euro',    name: 'q3.euro',    desc: 'q3.euro.d' },
    { v: 'carving', photo: 'carving', name: 'q3.carving', desc: 'q3.carving.d' },
    { v: 'fillet',  photo: 'fillet',  name: 'q3.fillet',  desc: 'q3.fillet.d' },
    { v: 'hunting', photo: 'hunting', name: 'q3.hunting', desc: 'q3.hunting.d' }
  ];

  /**
   * Salida para todo lo que no está en la rejilla: pelador, EDC, cuchilla,
   * japonés fino... Sin fotografía no ponemos tarjeta, pero tampoco dejamos
   * al cliente sin respuesta: esta opción lleva a la pantalla que pide el
   * ángulo del fabricante, que es lo correcto cuando no sabemos la hoja.
   */
  const OTHER = { v: 'unsure', name: 'pick.none', desc: 'pick.none.d' };

  /**
   * No compatibles. Van como lista de texto, sin ilustración: no vamos a
   * dibujar hojas inventadas, pero quitarlas dejaría al cliente sin el aviso
   * de seguridad, que es justo lo que no puede faltar.
   */
  const NOT_FOR = [
    { v: 'serrated',     name: 'q1.serrated',     desc: 'q1.serrated.d' },
    { v: 'ceramic',      name: 'q1.ceramic',      desc: 'q1.ceramic.d' },
    { v: 'single_bevel', name: 'q1.single_bevel', desc: 'q1.single_bevel.d' }
  ];

  const INCOMPATIBLE_VALUES = NOT_FOR.map(k => k.v);

  /**
   * Despiece del afilador. `left` y `width` son porcentajes del lienzo,
   * medidos sobre el render de producto; `shift` es cuánto se desplaza cada
   * pieza hacia el centro al montarse. No tocar a ojo.
   */
  const EXPLODED = [
    { id: 'p1-disc-out-l', left: 0,      width: 11.152, shift: -78 },
    { id: 'p2-cap-l',      left: 10.037, width: 15.985, shift: -34 },
    { id: 'p3-body',       left: 24.907, width: 49.814, shift: 0 },
    { id: 'p4-cap-r',      left: 73.606, width: 14.126, shift: 34 },
    { id: 'p5-disc-out-r', left: 86.989, width: 13.011, shift: 78 }
  ];

  /** La altura se deduce de la hoja: no hace falta preguntarla. */
  const HEIGHT_BY_TYPE = { cleaver: 'tall', paring: 'small', edc: 'small' };

  const CONDITIONS = ['maintain', 'dull', 'minor', 'deep_nick', 'tip_broken', 'unsure'];

  function answersForEngine() {
    const a = Object.assign({}, state.answers);
    if (a.knifeType) a.bladeHeight = a.bladeHeight || HEIGHT_BY_TYPE[a.knifeType] || 'normal';
    if (a.discReachesEdge === undefined) a.discReachesEdge = 'untested';
    return a;
  }

  function provisional() {
    return RULES.recommend(Object.assign(answersForEngine(), { condition: state.answers.condition || 'dull' }));
  }

  function questions() {
    const a = state.answers;
    const list = [{ id: 'knife', kind: 'knife' }];
    if (a.edge && a.edge !== 'straight_double') return list;
    if (!a.knifeType) return list;

    list.push({ id: 'condition', kind: 'choice', title: 'q6.title',
      options: CONDITIONS.map(v => ({ v, name: 'q6.' + v, desc: 'q6.' + v + '.d' })) });

    list.push({ id: 'knowsAngle', kind: 'angle', title: 'q2.title', help: 'q2.help' });

    if (a.priority !== undefined || provisional().needsPriority) {
      list.push({ id: 'priority', kind: 'choice', title: 'q4.title', help: 'q4.help',
        options: ['precision', 'balanced', 'durability'].map(v => ({ v, name: 'q4.' + v, desc: 'q4.' + v + '.d' })) });
    }
    return list;
  }

  function go(view, extra) {
    Object.assign(state, { view: view, error: null }, extra || {});
    render();
    const h = document.querySelector('#main h1, #main .q__title, #main .card__title, #main .step h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    if (window.scrollTo) window.scrollTo(0, 0);
  }

  /* ===================== vistas ===================== */

  function knifeCard(k) {
    const id = 'knife-' + k.v;
    const checked = state.answers.knifeType === k.v;
    return `<li class="pick pick--photo">
      <input type="radio" name="knife" id="${id}" value="${k.v}"${checked ? ' checked' : ''}>
      <label for="${id}">
        <span class="pick__art">
          <picture>
            <source srcset="${PHOTOS[k.photo]}" type="image/webp">
            <img src="${PHOTOS[k.photo]}" alt="" loading="lazy" decoding="async">
          </picture>
        </span>
        <span class="pick__name">${esc(t(k.name))}</span>
        <span class="pick__desc">${esc(t(k.desc))}</span>
      </label>
    </li>`;
  }

  function plainRow(k, name) {
    const id = 'knife-' + k.v;
    return `<li class="row-opt">
      <input type="radio" name="${name}" id="${id}" value="${k.v}">
      <label for="${id}">
        <span class="row-opt__name">${esc(t(k.name))}</span>
        <span class="row-opt__desc">${esc(t(k.desc))}</span>
      </label>
    </li>`;
  }

  function viewKnifePicker() {
    return `
      <div class="product-film" aria-hidden="true">
        <video class="product-film__video" autoplay muted loop playsinline preload="auto"
          poster="assets/video/manzaki-product-animation-poster.jpg">
          <source src="assets/video/manzaki-product-animation.mp4" type="video/mp4">
        </video>
      </div>

      <section class="opening">
        <p class="eyebrow">${esc(t('home.eyebrow'))}</p>
        <h1 class="opening__q">${esc(t('q3.title'))}</h1>
        <p class="lead">${esc(t('home.lead'))}</p>
        <p class="brand-line">${esc(t('brand.short'))}</p>
      </section>

      <aside class="large-knife-note" aria-labelledby="large-knife-title">
        <div class="large-knife-note__icon" aria-hidden="true">↥</div>
        <div>
          <h2 id="large-knife-title">${esc(t('largeknife.title'))}</h2>
          <p>${esc(t('largeknife.body'))}</p>
        </div>
      </aside>

      <ul class="picks">
        ${KNIVES.map(knifeCard).join('')}
        <li class="pick pick--other">
          <input type="radio" name="knife" id="knife-unsure" value="unsure">
          <label for="knife-unsure">
            <span class="pick__name">${esc(t(OTHER.name))}</span>
            <span class="pick__desc">${esc(t(OTHER.desc))}</span>
          </label>
        </li>
      </ul>

      <div class="rule"><span>${esc(t('safety.h1'))}</span></div>
      <ul class="rows">${NOT_FOR.map(k => plainRow(k, 'knife')).join('')}</ul>

      <section class="video" id="video" aria-labelledby="video-h">
        <h2 id="video-h">${esc(t('video.title'))}</h2>
        ${videoBlock()}
        <details class="transcript">
          <summary>${esc(t('video.transcript'))}</summary>
          <p>${esc(t('video.transcript.body'))}</p>
        </details>
      </section>

      <section class="about" aria-labelledby="about-h">
        <div class="about__text about__text--wide">
          <p class="eyebrow">${esc(t('about.eyebrow'))}</p>
          <h2 id="about-h">${esc(t('about.title'))}</h2>
          ${[1, 2, 3].map(i => `<p>${esc(t('about.p' + i))}</p>`).join('')}
        </div>
      </section>

      ${reviewBlock()}`;
  }

  function videoBlock() {
    const v = CFG.video;
    if (!v) return `<div class="video__frame"><div class="video__ph">${esc(t('video.missing'))}</div></div>`;
    if (v.type === 'file') {
      const tracks = Object.keys(v.captions || {}).map(l =>
        `<track kind="captions" srclang="${l}" label="${esc(DICTS[l] ? DICTS[l]['lang.name'] : l)}"
                src="${esc(v.captions[l])}"${l === lang ? ' default' : ''}>`).join('');
      return `<div class="video__frame">
        <video controls muted playsinline preload="metadata" poster="${esc(v.poster || '')}"
               aria-label="${esc(t('video.title'))}">${tracks}
          <source src="${esc(v.src)}" type="video/mp4">
        </video></div>`;
    }
    const src = v.type === 'youtube'
      ? 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.id) + '?autoplay=1&cc_load_policy=1'
      : 'https://player.vimeo.com/video/' + encodeURIComponent(v.id) + '?autoplay=1&texttrack=' + lang;
    return `<div class="video__frame" data-embed="${esc(src)}">
      ${v.poster ? `<img class="video__poster" src="${esc(v.poster)}" alt="">` : ''}
      <button class="video__play" type="button"><span>${esc(t('video.play'))}</span></button>
    </div>`;
  }

  function viewQuiz() {
    const qs = questions();
    const i = Math.min(state.qi, qs.length - 1);
    const q = qs[i];
    if (q.kind === 'knife') return viewKnifePicker();

    const a = state.answers;
    let body;
    if (q.kind === 'angle') {
      body = `
        <ul class="options">
          ${['yes', 'no', 'unsure'].map(v => optionRow('knowsAngle', v, t('q2.' + v))).join('')}
        </ul>
        ${a.knowsAngle === 'yes' ? `
        <div class="field">
          <label for="ang">${esc(t('q2.input.label'))}</label>
          <input type="number" id="ang" min="5" max="40" step="0.5" inputmode="decimal"
                 value="${a.manufacturerAngle != null ? a.manufacturerAngle : ''}" aria-describedby="ang-hint">
          <p class="hint" id="ang-hint">${esc(t('q2.input.hint'))}</p>
          ${a.manufacturerAngle != null ? `<p class="hint">${esc(t('q2.total.hint', { n: a.manufacturerAngle * 2 }))}</p>` : ''}
          ${state.error ? `<p class="err" role="alert">${esc(t('q2.input.error'))}</p>` : ''}
        </div>` : ''}`;
    } else {
      body = `<ul class="options">
        ${q.options.map(o => optionRow(q.id, o.v, t(o.name), o.desc ? t(o.desc) : '')).join('')}
      </ul>`;
    }

    const answered = q.kind === 'angle'
      ? (a.knowsAngle === 'no' || a.knowsAngle === 'unsure' || (a.knowsAngle === 'yes' && a.manufacturerAngle != null))
      : a[q.id] !== undefined;

    return `
      <section class="quiz">
        <div class="progress">
          <p class="progress__label">${esc(t('progress.step', { n: i, total: qs.length - 1 }))}</p>
          <div class="progress__track" role="progressbar" aria-label="${esc(t('a11y.progress'))}"
               aria-valuemin="1" aria-valuemax="${qs.length - 1}" aria-valuenow="${i}">
            <div class="progress__bar" style="width:${Math.round(i / (qs.length - 1) * 100)}%"></div>
          </div>
        </div>
        <p class="chip">${esc(t(a.knifeType ? 'q3.' + a.knifeType : 'q3.unsure'))}</p>
        <fieldset>
          <legend class="q__title">${esc(t(q.title))}</legend>
          ${q.help ? `<p class="q__help">${esc(t(q.help))}</p>` : ''}
          ${body}
        </fieldset>
        <div class="nav-row nav-row--back">
          <button class="btn btn--quiet" data-back>${esc(t('btn.back'))}</button>
          ${q.kind === 'angle' && a.knowsAngle === 'yes'
            ? `<button class="btn btn--primary" data-next ${answered ? '' : 'disabled'}>${esc(t('btn.next'))}</button>`
            : ''}
        </div>
      </section>`;
  }

  /**
   * Avanza a la siguiente pregunta, o al resultado si era la última.
   * Sin retardo: cualquier espera artificial se nota en el móvil y no
   * aporta nada. Para atrás está el botón de atrás.
   */
  function advance() {
    const qs = questions();
    if (state.qi >= qs.length - 1) go('result'); else go('quiz', { qi: state.qi + 1 });
  }

  function optionRow(name, value, label, desc) {
    const id = name + '-' + value;
    const checked = String(state.answers[name]) === String(value);
    return `<li class="opt">
      <input type="radio" name="${name}" id="${id}" value="${value}"${checked ? ' checked' : ''}>
      <label class="opt__box" for="${id}">
        <span class="opt__mark" aria-hidden="true"></span>
        <span class="opt__body">
          <span class="opt__name">${esc(label)}</span>
          ${desc ? `<span class="opt__desc">${esc(desc)}</span>` : ''}
        </span>
      </label>
    </li>`;
  }

  function bladeFigure(type) {
    const k = KNIVES.find(x => x.v === type);
    if (k && k.photo) {
      return `<picture>
        <source srcset="${PHOTOS[k.photo]}" type="image/webp">
        <img src="${PHOTOS[k.photo]}" alt="" loading="lazy" decoding="async">
      </picture>`;
    }
    return ART.bladeArt(type || 'unsure');
  }

  function viewResult() {
    const a = answersForEngine();
    const r = RULES.recommend(a);

    if (r.status === 'stop') {
      return `<section class="quiz"><div class="card card--alert">
        <h2 class="card__title">${esc(t('result.stop.title'))}</h2>
        <p>${esc(t('result.stop.lead'))}</p>
        ${r.stop.map(c => `<div class="stop"><p>${esc(t('code.' + c))}</p></div>`).join('')}
        <div class="actions">
          <button class="btn btn--primary" data-restart>${esc(t('result.cta.other'))}</button>
          <a class="btn btn--quiet" href="seguridad.html?lang=${lang}">${esc(t('nav.safety'))}</a>
        </div></div></section>`;
    }

    if (r.status === 'ask_manufacturer' && r.angle === null) {
      return `<section class="quiz"><div class="card card--alert">
        <h2 class="card__title">${esc(t('result.ask.title'))}</h2>
        <p>${esc(t('result.ask.lead'))}</p>
        ${[].concat(r.notes, r.warnings).map(c => `<div class="warn"><p>${esc(t('code.' + c))}</p></div>`).join('')}
        <p>${esc(t('result.ask.cta'))}</p>
        <div class="actions">
          <button class="btn btn--primary" data-change>${esc(t('result.cta.change'))}</button>
          <a class="btn btn--quiet" href="metodologia.html?lang=${lang}">${esc(t('nav.method'))}</a>
        </div></div></section>`;
    }

    const discs = r.discs.length === 1 ? t('result.discs.1000') : t('result.discs.400_1000');
    const prep = r.needsRiser === true ? t('result.prep.riser')
      : r.needsRiser === 'maybe' ? t('result.prep.riser_maybe') : t('result.prep.flat');
    const why = r.angleSource === 'manufacturer_exact' ? t('why.manufacturer_exact')
      : r.angleSource === 'manufacturer_nearest' ? t('why.manufacturer_nearest', { m: r.manufacturerAngle })
      : r.angleSource === 'priority' ? t('why.priority') : t('why.type_default');

    const warnings = [].concat(r.warnings, r.deltaCode && r.deltaCode !== 'delta_equivalent' ? [r.deltaCode] : []);
    const notes = r.notes.filter(n => n !== 'starting_point_only');

    return `
      <section class="quiz" aria-live="polite">
        <div class="verdict">
          <p class="eyebrow">${esc(t('result.title'))}</p>
          <div class="verdict__grid">
            <div class="verdict__num">
              <span class="verdict__angle">${r.angle}<i>°</i></span>
              <span class="verdict__unit">${esc(t('result.angle.perside'))}</span>
            </div>
            <div class="verdict__dial">${ART.dial(r.angle, { label: r.angle + '°', size: 150 })}</div>
          </div>
          <p class="verdict__why">${esc(why)}</p>
          <div class="verdict__blade">${bladeFigure(state.answers.knifeType)}</div>
        </div>

        <div class="card">
          <dl class="spec">
            <div><dt>${esc(t('result.type'))}</dt><dd>${esc(t('q3.' + (state.answers.knifeType || 'unsure')))}</dd></div>
            <div><dt>${esc(t('result.state'))}</dt><dd>${esc(t('q6.' + (state.answers.condition || 'unsure')))}</dd></div>
            <div><dt>${esc(t('result.discs'))}</dt><dd>${esc(discs)}</dd></div>
            <div><dt>${esc(t('result.prep'))}</dt><dd>${esc(prep)}</dd></div>
            <div><dt>${esc(t('result.pressure'))}</dt><dd>${esc(t('result.pressure.light'))}</dd></div>
            <div><dt>${esc(t('result.work'))}</dt><dd>${esc(t('result.work.both'))}</dd></div>
            <div><dt>${esc(t('result.compat'))}</dt><dd>${esc(t('result.compat.yes'))}</dd></div>
          </dl>

          <h3>${esc(t('steps.intro'))}</h3>
          <ol class="plan">
            ${[1, 2, 3].map(i => `<li><span>${i}</span>${esc(t('scene.s' + i))}</li>`).join('')}
          </ol>

          <div class="note"><p>${esc(t('result.disclaimer'))}</p></div>
          ${warnings.map(c => `<div class="warn"><p>${esc(t('code.' + c))}</p></div>`).join('')}
          ${notes.map(c => `<div class="note"><p>${esc(t('code.' + c))}</p></div>`).join('')}

          <div class="actions">
            <button class="btn btn--primary btn--big" data-go="steps">${esc(t('result.cta.start'))}</button>
            <button class="btn btn--quiet" data-change>${esc(t('result.cta.change'))}</button>
            <button class="btn btn--quiet" data-restart>${esc(t('result.cta.other'))}</button>
          </div>
        </div>

        ${techniqueBlock(r.discs)}
        ${r.markerTest ? markerBlock() : ''}
      </section>`;
  }

  /** Qué disco, a qué ritmo y cómo saber que ese lado ya está. */
  function techniqueBlock(discs) {
    const rows = [
      ['tech.speed', 'tech.speed.v'],
      ['tech.passes', 'tech.passes.v'],
      ['tech.burr', 'tech.burr.v'],
      ['tech.finish', 'tech.finish.v']
    ];
    const discRows = discs.indexOf('400') > -1
      ? [['tech.d400', 'tech.d400.v'], ['tech.d1000', 'tech.d1000.v']]
      : [['tech.d1000', 'tech.d1000.v']];
    return `<div class="card" style="margin-top:1.5rem">
      <h3>${esc(t('tech.title'))}</h3>
      <dl class="spec">
        ${discRows.concat(rows).map(([k, v]) =>
          `<div><dt>${esc(t(k))}</dt><dd>${esc(t(v))}</dd></div>`).join('')}
      </dl>
      <div class="warn"><p>${esc(t('never.tilt'))}</p></div>
    </div>`;
  }

  /**
   * Cierre de la guía: una sola tarjeta. Gracias, una línea de ayuda y, si
   * hay enlace, la reseña. Ni un bloque más: al terminar de afilar el cliente
   * no quiere leer tres tarjetas seguidas pidiéndole cosas.
   */
  function closingBlock() {
    return `<div class="card card--thanks">
      <h3>${esc(t('thanks.title'))}</h3>
      <p>${esc(t('thanks.p1'))}</p>
      ${reviewLink() ? `<p class="closing__ask">${esc(t('review.lead'))}</p>
        <div class="actions">
          <a class="btn btn--primary" href="${esc(reviewLink())}" target="_blank"
             rel="noopener">${esc(t('review.top'))}</a>
        </div>` : ''}
    </div>`;
  }

  /** Llamada a reseña de la pantalla inicial. Sin URL no existe. */
  function reviewBlock() {
    const url = reviewLink();
    if (!url) return '';
    return `<div class="card card--review">
      <h3>${esc(t('review.title'))}</h3>
      <p>${esc(t('review.lead'))}</p>
      <div class="actions">
        <a class="btn btn--primary" href="${esc(url)}"
           target="_blank" rel="noopener">${esc(t('review.top'))}</a>
      </div>
    </div>`;
  }

  function markerBlock() {
    return `<div class="card" style="margin-top:1.5rem">
      <h3>${esc(t('marker.title'))}</h3>
      <p>${esc(t('marker.lead'))}</p>
      <ol class="steps-list">${[1, 2, 3, 4, 5].map(i => `<li>${esc(t('marker.s' + i))}</li>`).join('')}</ol>
      <ul class="marker-grid">
        ${[['edge', 'marker.r1'], ['top', 'marker.r2'], ['even', 'marker.r3']].map(([w, k]) =>
          `<li>${ART.marker(w)}<p>${esc(t(k))}</p></li>`).join('')}
      </ul>
      <div class="warn"><p>${esc(t('marker.warn'))}</p></div>
    </div>`;
  }

  /* ---------- cuestionario de opinión ---------- */

  /**
   * Arma el texto de la respuesta. Incluye las respuestas del test porque
   * sin saber qué cuchillo era, la opinión no dice gran cosa. No incluye
   * nada más: ni nombre, ni correo, ni identificador de sesión.
   */
  function feedbackPayload() {
    const a = state.answers;
    const r = RULES.recommend(answersForEngine());
    return {
      idioma: lang,
      cuchillo: a.knifeType || null,
      estado: a.condition || null,
      angulo: r.angle,
      filo: state.fb.q1,
      facilidad: state.fb.q2,
      mejoraria: state.fb.text || ''
    };
  }

  function feedbackText() {
    const p = feedbackPayload();
    return Object.keys(p).map(k => k + ': ' + (p[k] === null ? '-' : p[k])).join('\n');
  }

  function viewFeedback() {
    const fb = state.fb;
    if (fb.status === 'sent') {
      return `<section class="quiz"><div class="card">
        <h2 class="card__title">${esc(t('fb.thanks'))}</h2>
        <div class="actions">
          <button class="btn btn--quiet" data-restart>${esc(t('result.cta.other'))}</button>
        </div></div>
        ${closingBlock()}
        </section>`;
    }

    const scale = (name, keys) => `<ul class="options options--inline">
      ${keys.map(k => `<li class="opt">
        <input type="radio" name="fb-${name}" id="fb-${name}-${k}" value="${k}"${fb[name] === k ? ' checked' : ''}>
        <label class="opt__box" for="fb-${name}-${k}">
          <span class="opt__mark" aria-hidden="true"></span>
          <span class="opt__body"><span class="opt__name">${esc(t('fb.' + name + '.' + k))}</span></span>
        </label></li>`).join('')}
    </ul>`;

    return `<section class="quiz">
      <div class="card">
        <h2 class="card__title">${esc(t('fb.title'))}</h2>
        <p>${esc(t('fb.lead'))}</p>

        <fieldset class="fb-block">
          <legend class="gate__q">${esc(t('fb.q1'))}</legend>
          ${scale('q1', ['a', 'b', 'c', 'd'])}
        </fieldset>

        <fieldset class="fb-block">
          <legend class="gate__q">${esc(t('fb.q2'))}</legend>
          ${scale('q2', ['a', 'b', 'c'])}
        </fieldset>

        <div class="field fb-block">
          <label for="fb-text">${esc(t('fb.q3'))}</label>
          <textarea id="fb-text" rows="4" placeholder="${esc(t('fb.q3.ph'))}">${esc(fb.text)}</textarea>
        </div>

        <p class="q__help">${esc(t('fb.privacy'))}</p>
        ${fb.status === 'pending' ? `<div class="warn"><p>${esc(t('fb.pending'))}</p></div>` : ''}
        ${fb.status === 'error' ? `<div class="warn"><p>${esc(t('fb.pending'))}</p></div>` : ''}

        <div class="actions">
          <button class="btn btn--primary btn--big" data-fb-send>${esc(t('fb.send'))}</button>
          <button class="btn btn--quiet" data-fb-copy>${esc(t('fb.copy'))}</button>
          <button class="btn btn--quiet" data-go="result">${esc(t('fb.skip'))}</button>
        </div>
      </div>
    </section>`;
  }

  function sendFeedback() {
    const payload = feedbackPayload();
    if (CFG.feedbackEndpoint) {
      fetch(CFG.feedbackEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(res => {
        state.fb.status = res.ok ? 'sent' : 'error';
        render();
      }).catch(() => { state.fb.status = 'error'; render(); });
      return;
    }
    if (CFG.supportEmail) {
      const url = 'mailto:' + CFG.supportEmail +
        '?subject=' + encodeURIComponent('MANZAKI — ' + t('fb.title')) +
        '&body=' + encodeURIComponent(feedbackText());
      window.location.href = url;
      state.fb.status = 'sent';
      render();
      return;
    }
    // Sin destino configurado no fingimos que se ha enviado.
    state.fb.status = 'pending';
    render();
  }

  /* ---------- modo paso a paso ---------- */

  /**
   * Los ocho pasos del manual impreso, en su orden. El paso 7 (hoja grande)
   * solo se muestra si hace falta elevar el rodillo: enseñárselo a alguien
   * con un fileteador es ruido. Los lados ya no son una casilla: el manual
   * los separa en los pasos 5 y 6.
   */
  function stepList() {
    const needsRiser = state.answers.discReachesEdge === 'no'
      || state.answers.discReachesEdge === 'untested'
      || RULES.recommend(answersForEngine()).riser;
    return ['1', '2', '3', '4', '5', '6', '7', '8']
      .filter(id => id !== '7' || needsRiser)
      .map(id => ({ id, side: id === '5' ? 'a' : (id === '6' ? 'b' : null) }));
  }

  /** Pregunta de seguridad incrustada en un paso. */
  function gate(name, titleKey, helpKey, opts, blockOn) {
    const chosen = state.answers[name];
    return `<div class="gate">
      <p class="gate__q">${esc(t(titleKey))}</p>
      <p class="q__help">${esc(t(helpKey))}</p>
      <ul class="options options--inline">
        ${opts.map(o => optionRow(name, o.v, t(o.k))).join('')}
      </ul>
      ${chosen === blockOn ? `<div class="stop"><p>${esc(t(
        name === 'magneticGrip' ? 'code.stop_not_secure' : 'code.riser_board_required'))}</p></div>` : ''}
    </div>`;
  }

  function viewSteps() {
    const steps = stepList();
    const i = Math.min(state.si, steps.length);
    if (i >= steps.length) {
      return `<section class="step"><div class="card">
        <h2 class="card__title">${esc(t('steps.done'))}</h2>
        <p>${esc(t('steps.done.lead'))}</p>
        <div class="actions">
          <button class="btn btn--primary btn--big" data-go="feedback">${esc(t('fb.open'))}</button>
          <button class="btn btn--quiet" data-go="result">${esc(t('result.title'))}</button>
          <button class="btn btn--quiet" data-restart>${esc(t('result.cta.other'))}</button>
        </div></div>
        ${closingBlock()}
        </section>`;
    }
    const s = steps[i];
    const r = RULES.recommend(answersForEngine());

    let extras = '';
    // El imán se comprueba al colocar el cuchillo, que es el paso 3.
    if (s.id === '3') {
      extras += gate('magneticGrip', 'q5c.title', 'q5c.help',
        [{ v: 'firm', k: 'q5c.firm' }, { v: 'loose', k: 'q5c.loose' }, { v: 'unsure', k: 'q5c.unsure' }], 'loose');
    }
    // El alcance del disco solo se puede mirar con el cuchillo ya puesto,
    // así que la pregunta va justo antes de la primera pasada.
    if (s.id === '5') {
      extras += gate('discReachesEdge', 'q5b.title', 'q5b.help',
        [{ v: 'yes', k: 'q5b.yes' }, { v: 'no', k: 'q5b.no' }, { v: 'untested', k: 'q5b.untested' }], 'no');
      if (state.answers.discReachesEdge === 'no') extras += `<div class="step__art">${ART.riser(true)}</div>`;
    }

    return `
      <section class="step">
        <p class="step__k">${esc(t('steps.of', { n: i + 1, total: steps.length }))}</p>
        <div class="progress__track"><div class="progress__bar" style="width:${Math.round((i + 1) / steps.length * 100)}%"></div></div>
        ${s.side ? `<p class="side-flag">${esc(t(s.side === 'a' ? 'steps.side.a' : 'steps.side.b'))}</p>` : ''}
        <h2>${esc(t('step' + s.id + '.t'))}</h2>
        ${s.id === '2' ? `<div class="verdict__grid verdict__grid--step">
            <div class="verdict__num"><span class="verdict__angle">${r.angle}<i>°</i></span>
            <span class="verdict__unit">${esc(t('result.angle.perside'))}</span></div>
            <div class="verdict__dial">${ART.dial(r.angle, { label: r.angle + '°', size: 140 })}</div>
          </div>` : ''}
        <p class="step__body">${esc(t('step' + s.id + '.b'))}</p>
        ${extras}
        ${s.side ? `<div class="note"><p>${esc(t('never.passes'))}</p></div>` : ''}
        ${s.id === '6' && r.discs.indexOf('400') > -1
          ? `<div class="note note--next"><p>${esc(t('step.second_disc'))}</p></div>` : ''}
        ${s.side ? `<div class="warn"><p>${esc(t('never.finger'))}</p></div>` : ''}

        <div class="nav-row">
          <button class="btn btn--quiet" data-step="-1">${esc(t('btn.back'))}</button>
          <button class="btn btn--primary btn--big" data-step="1">${esc(t(
            i + 1 === steps.length ? 'btn.finish' : 'btn.next'))}</button>
        </div>

        <div class="toggles">
          <label class="toggle"><input type="checkbox" data-hc> ${esc(t('steps.contrast'))}</label>
          <label class="toggle"><input type="checkbox" data-awake> ${esc(t('steps.awake'))}</label>
        </div>
      </section>`;
  }

  /* ===================== render y eventos ===================== */

  const prefs = { hc: false, awake: false };
  let wakeLock = null;

  function render() {
    if (!app) return;
    const map = { quiz: viewQuiz, result: viewResult, steps: viewSteps, feedback: viewFeedback };
    app.innerHTML = (map[state.view] || viewQuiz)();
    document.body.classList.toggle('hc', prefs.hc);
    const hcBox = app.querySelector('[data-hc]'); if (hcBox) hcBox.checked = prefs.hc;
    const awBox = app.querySelector('[data-awake]'); if (awBox) awBox.checked = prefs.awake;
  }

  async function setWakeLock(on) {
    try {
      if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) {}
  }

  function toast(msg) {
    const el = document.createElement('p');
    el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  /**
   * Una sola vía para registrar la respuesta, la dispare quien la dispare.
   *
   * Antes esto vivía solo en el evento `change`, y ahí había un fallo real:
   * si la opción ya estaba marcada, tocarla otra vez no dispara `change` y no
   * pasaba nada. El cliente tenía que elegir otra respuesta y volver, o
   * insistir varias veces. Ahora el `click` también entra aquí.
   */
  function pickAnswer(el) {
    if (el.name.indexOf('fb-') === 0) {
      state.fb[el.name.slice(3)] = el.value;
      state.fb.status = null;
      render(); return;
    }
    if (el.name === 'knife') {
      if (INCOMPATIBLE_VALUES.includes(el.value)) {
        state.answers.edge = el.value;
        delete state.answers.knifeType;
        save(); go('result'); return;
      }
      state.answers.edge = 'straight_double';
      state.answers.knifeType = el.value;
      delete state.answers.priority;
      save(); go('quiz', { qi: 1 }); return;
    }
    state.answers[el.name] = el.value;
    if (el.name === 'knowsAngle' && el.value !== 'yes') delete state.answers.manufacturerAngle;
    save();
    // Solo el cuestionario avanza solo. Las preguntas de seguridad viven
    // dentro del paso a paso y ahí no se salta nada: el cliente tiene que
    // poder leer el aviso que acaba de aparecer.
    if (state.view !== 'quiz') { render(); return; }
    // Si la respuesta pide un dato más (el ángulo del fabricante), nos
    // quedamos aquí hasta que lo escriba.
    if (el.name === 'knowsAngle' && el.value === 'yes') { render(); return; }
    advance();
  }

  if (app) {
    app.addEventListener('click', e => {
      const el = e.target.closest('input[type="radio"]');
      if (!el || !el.checked) return;
      // Si `change` ya se ocupó, la pantalla se ha repintado y este nodo está
      // desconectado. Solo seguimos si sigue vivo, que es el caso de volver a
      // tocar una opción que ya estaba marcada.
      if (el.isConnected) pickAnswer(el);
    });

    app.addEventListener('change', e => {
      const el = e.target;
      if (el.id === 'fb-text') { state.fb.text = el.value; return; }
      if (el.matches('input[type="radio"]')) { pickAnswer(el); return; }
      if (el.id === 'ang') {
        const n = parseFloat(el.value);
        if (Number.isNaN(n) || n < 5 || n > 40) { state.error = true; delete state.answers.manufacturerAngle; }
        else { state.error = false; state.answers.manufacturerAngle = n; }
        save(); render();
        const inp = document.getElementById('ang'); if (inp) { inp.focus(); inp.select(); }
        return;
      }
      if (el.matches('[data-hc]')) { prefs.hc = el.checked; document.body.classList.toggle('hc', prefs.hc); }
      if (el.matches('[data-awake]')) { prefs.awake = el.checked; setWakeLock(prefs.awake); }
    });

    app.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;

      if (b.classList.contains('video__play')) {
        const frame = b.closest('[data-embed]');
        frame.innerHTML = `<iframe src="${frame.dataset.embed}" title="${esc(t('video.title'))}"
          allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
        return;
      }
      if (b.dataset.go) {
        if (b.dataset.go === 'steps') { state.si = 0; state.side = 'a'; }
        go(b.dataset.go); return;
      }
      if (b.hasAttribute('data-next')) {
        const qs = questions();
        if (state.qi >= qs.length - 1) go('result'); else go('quiz', { qi: state.qi + 1 });
        return;
      }
      if (b.hasAttribute('data-back')) { go('quiz', { qi: Math.max(0, state.qi - 1) }); return; }
      if (b.hasAttribute('data-change')) { go('quiz', { qi: 0 }); return; }
      if (b.hasAttribute('data-restart')) {
        state.answers = {}; state.qi = 0; state.si = 0;
        try { localStorage.removeItem(CFG.storageKey); } catch (err) {}
        const u = new URL(location.href); u.search = ''; u.searchParams.set('lang', lang);
        history.replaceState(null, '', u);
        go('quiz'); return;
      }
      if (b.hasAttribute('data-fb-send')) {
        const ta = document.getElementById('fb-text');
        if (ta) state.fb.text = ta.value;
        sendFeedback(); return;
      }
      if (b.hasAttribute('data-fb-copy')) {
        const ta = document.getElementById('fb-text');
        if (ta) state.fb.text = ta.value;
        const txt = feedbackText();
        if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast(t('fb.copied')));
        else toast(txt);
        return;
      }
      if (b.dataset.step) {
        const next = state.si + parseInt(b.dataset.step, 10);
        if (next < 0) { go('result'); return; }
        state.side = 'a';
        go('steps', { si: next });
        return;
      }
    });
  }

  /* ===================== arranque ===================== */

  function updateStructuredData() {
    const node = document.getElementById('ld-guide');
    if (!node) return;
    try {
      const data = JSON.parse(node.textContent);
      data.name = t('meta.title');
      data.description = t('meta.description');
      data.inLanguage = lang;
      data.step = ['1', '2', '3', '4', '5', '6', '7'].map((id, i) => ({
        '@type': 'HowToStep', position: i + 1,
        name: t('step' + id + '.t'), text: t('step' + id + '.b')
      }));
      node.textContent = JSON.stringify(data);
    } catch (e) {}
  }

  document.documentElement.lang = lang;
  mountLanguagePicker();
  translateStatic();
  mountReviewLinks();
  mountSocialLinks();
  updateStructuredData();
  if (app) { restore(); render(); }
})();

</script>
</body>
</html>
